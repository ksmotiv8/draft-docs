<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e2a3a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="620" rx="28" fill="#edf1f7"/>

  <text x="92" y="86" font-size="34" font-weight="700" fill="#1e2a3a">The frontier launch cadence is accelerating</text>
  <text x="92" y="124" font-size="19" fill="#5b6b7c">Major model releases, April to July 2026</text>

  <!-- timeline -->
  <line x1="130" y1="330" x2="1470" y2="330" stroke="#aebbc9" stroke-width="7" stroke-linecap="round"/>

  <!-- dots -->
  <circle cx="215" cy="330" r="14" fill="#6366f1" stroke="#ffffff" stroke-width="5"/>
  <circle cx="490" cy="330" r="14" fill="#8b5cf6" stroke="#ffffff" stroke-width="5"/>
  <circle cx="765" cy="330" r="14" fill="#10a37f" stroke="#ffffff" stroke-width="5"/>
  <circle cx="1040" cy="330" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>
  <circle cx="1330" cy="330" r="14" fill="#16283c" stroke="#ffffff" stroke-width="5"/>

  <!-- Gemma 4 (above) -->
  <g filter="url(#card)">
    <rect x="80" y="175" width="270" height="118" rx="14" fill="#ffffff"/>
    <text x="104" y="212" font-size="15" font-weight="700" letter-spacing="1" fill="#6366f1">APR 2</text>
    <text x="104" y="246" font-size="24" font-weight="700" fill="#1e2a3a">Gemma 4</text>
    <text x="104" y="274" font-size="15" fill="#5b6b7c">Google open-model family</text>
  </g>

  <!-- Claude Fable 5 (below) -->
  <g filter="url(#card)">
    <rect x="355" y="368" width="270" height="118" rx="14" fill="#ffffff"/>
    <text x="379" y="405" font-size="15" font-weight="700" letter-spacing="1" fill="#8b5cf6">JUN 9</text>
    <text x="379" y="439" font-size="24" font-weight="700" fill="#1e2a3a">Claude Fable 5</text>
    <text x="379" y="467" font-size="15" fill="#5b6b7c">Anthropic frontier model</text>
  </g>

  <!-- GLM-5.2 (above) -->
  <g filter="url(#card)">
    <rect x="630" y="175" width="270" height="118" rx="14" fill="#ffffff"/>
    <text x="654" y="212" font-size="15" font-weight="700" letter-spacing="1" fill="#10a37f">JUN 16</text>
    <text x="654" y="246" font-size="24" font-weight="700" fill="#1e2a3a">GLM-5.2</text>
    <text x="654" y="274" font-size="15" fill="#5b6b7c">1M-context open model</text>
  </g>

  <!-- GPT-5.6 (below) -->
  <g filter="url(#card)">
    <rect x="905" y="368" width="270" height="118" rx="14" fill="#ffffff"/>
    <text x="929" y="405" font-size="15" font-weight="700" letter-spacing="1" fill="#f59e0b">JUN 26 / JUL 9</text>
    <text x="929" y="439" font-size="24" font-weight="700" fill="#1e2a3a">GPT-5.6</text>
    <text x="929" y="467" font-size="15" fill="#5b6b7c">Preview / general release</text>
  </g>

  <!-- Kimi K3 (above, dark) -->
  <g filter="url(#card)">
    <rect x="1180" y="175" width="300" height="118" rx="14" fill="#16283c"/>
    <text x="1204" y="212" font-size="15" font-weight="700" letter-spacing="1" fill="#7db4f5">JUL 16</text>
    <text x="1204" y="246" font-size="24" font-weight="700" fill="#ffffff">Kimi K3</text>
    <text x="1204" y="274" font-size="15" fill="#c3d2e0">2.8T open-weight model</text>
  </g>

  <text x="92" y="560" font-size="15" fill="#5b6b7c">Dates reflect official announcements; GPT-5.6 entered preview June 26 and general availability July 9.</text>
</svg>
